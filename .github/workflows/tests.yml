name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    name: Backend, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend, Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  contract:
    name: API types match the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend
      - name: Regenerate the frontend's API types from the backend's schemas
        run: |
          python backend/tools/dump_openapi.py "$RUNNER_TEMP/openapi.json"
          cd frontend && npx openapi-typescript "$RUNNER_TEMP/openapi.json" -o src/lib/api.generated.ts
      - name: Fail if the committed types are stale
        run: git diff --exit-code -- frontend/src/lib/api.generated.ts
